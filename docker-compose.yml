services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: network-backend
    restart: unless-stopped
    environment:
      PORT: "3200"
      NODE_ENV: production
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./.env:/app/.env
    ports:
      - "3200:3200"
    networks:
      - netmon

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: network-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3201:80"
    networks:
      - netmon

networks:
  netmon:
    driver: bridge
